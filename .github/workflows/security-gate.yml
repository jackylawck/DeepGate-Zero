name: Security & Governance Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-gate:
    name: Zero-Dependency AppSec Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 1. Verify required core files & syntax
        run: |
          for f in index.html style.css app.js README.md; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              exit 1
            fi
          done
          node --check app.js
          echo "Syntax and file integrity check passed."

      - name: 2. Secret leak guard (block hardcoded sk- keys)
        run: |
          if grep -rnE --exclude-dir=.git 'sk-[A-Za-z0-9_-]{20,}' .; then
            echo "::error::Potential hardcoded API key detected!"
            exit 1
          fi
          echo "No hardcoded API keys detected."

      - name: 3. Zero-storage, no-SW & DOM XSS guard
        run: |
          if grep -nE '\b(localStorage|sessionStorage|indexedDB)\b|document\.cookie|navigator\.serviceWorker|caches\.open' app.js index.html; then
            echo "::error::Forbidden browser storage or Service Worker API detected!"
            exit 1
          fi
          if grep -nE '(\.|\[["'\''])(innerHTML|outerHTML|insertAdjacentHTML)\b|document\.write[[:space:]]*\(|\beval[[:space:]]*\(|new[[:space:]]+Function[[:space:]]*\(' app.js index.html; then
            echo "::error::Forbidden DOM XSS or unsafe execution sink detected!"
            exit 1
          fi
          echo "Zero-storage, no-SW & DOM XSS checks passed."

      - name: 4. Strict CSP, PWA manifest, zero CDN, CSS & exact API allowlist
        run: |
          node << 'EOF'
          const fs = require("fs");
          const html = fs.readFileSync("index.html", "utf8");
          const css = fs.readFileSync("style.css", "utf8");
          const js = fs.readFileSync("app.js", "utf8");

          // A. 嚴格 CSP 與 Referrer 標頭檢核
          const requiredHtml = [
            [/http-equiv="Content-Security-Policy"/i, "Missing CSP meta tag in index.html"],
            [/default-src 'none'/, "CSP must enforce default-src 'none'"],
            [/script-src 'self'/, "CSP must enforce script-src 'self'"],
            [/style-src 'self'/, "CSP must enforce style-src 'self'"],
            [/connect-src https:\/\/api\.deepseek\.com;/, "CSP connect-src must be locked to https://api.deepseek.com"],
            [/object-src 'none'/, "CSP must enforce object-src 'none'"],
            [/worker-src 'none'/, "CSP must enforce worker-src 'none'"],
            [/base-uri 'none'/, "CSP must enforce base-uri 'none'"],
            [/form-action 'none'/, "CSP must enforce form-action 'none'"],
            [/name="referrer"\s+content="no-referrer"/i, "Missing no-referrer meta tag in index.html"],
          ];

          // 若頁面已掛載 PWA manifest，強制要求 CSP 鎖定 manifest-src 'self'
          if (/rel=["']manifest["']/i.test(html)) {
            requiredHtml.push([/manifest-src 'self'/, "CSP must enforce manifest-src 'self' when manifest is linked"]);
          }

          // 放行 SEO canonical 網址，嚴格封鎖其他所有外部 <script> 與 <link>
          const forbiddenHtml = [
            [/unsafe-inline|unsafe-eval/i, "CSP must not permit unsafe-inline or unsafe-eval"],
            [/<script(?![^>]*\bsrc=)[^>]*>/i, "Inline <script> tag is forbidden"],
            [/<script[^>]+src=["']https?:\/\//i, "External CDN script is forbidden"],
            [/<link(?![^>]*\brel=["']canonical["'])[^>]+href=["']https?:\/\//i, "External CDN stylesheet or link is forbidden"],
          ];

          for (const [re, msg] of requiredHtml) {
            if (!re.test(html)) {
              console.error("::error::" + msg);
              process.exit(1);
            }
          }
          for (const [re, msg] of forbiddenHtml) {
            if (re.test(html)) {
              console.error("::error::" + msg);
              process.exit(1);
            }
          }

          // 僅檢查 HTML 標籤內的 on* 事件屬性，避免英文正文誤報
          const htmlTags = html.match(/<[^>]+>/g) || [];
          for (const tag of htmlTags) {
            if (/\son[a-z]+\s*=/i.test(tag)) {
              console.error("::error::Inline HTML event handler is forbidden: " + tag);
              process.exit(1);
            }
          }

          // B. 若存在 manifest.json，驗證 JSON 語法且不含外部網址
          if (fs.existsSync("manifest.json")) {
            const rawManifest = fs.readFileSync("manifest.json", "utf8");
            try {
              JSON.parse(rawManifest);
            } catch (err) {
              console.error("::error::Invalid JSON in manifest.json: " + err.message);
              process.exit(1);
            }
            if (/https?:\/\//i.test(rawManifest)) {
              console.error("::error::External URL detected in manifest.json");
              process.exit(1);
            }
          }

          // C. style.css 零外部依賴與防資料外洩檢查
          if (/@import\b/i.test(css) || /https?:\/\//i.test(css)) {
            console.error("::error::External URL or @import detected in style.css");
            process.exit(1);
          }

          // D. app.js 精準端點白名單（防止誤觸雲端 Files API 或外部連線）
          const ALLOWED_ENDPOINTS = new Set([
            "https://api.deepseek.com/chat/completions",
            "https://api.deepseek.com/models",
          ]);
          const urls = js.match(/https?:\/\/[^\s"'`<>]+/gi) || [];
          const unauthorized = urls.filter((u) => !ALLOWED_ENDPOINTS.has(u));
          if (unauthorized.length > 0) {
            console.error("::error::Unauthorized external or non-allowlisted URL in app.js: " + unauthorized.join(", "));
            process.exit(1);
          }

          // E. 確保 fetch 維持零憑證、零快取與零 Referrer 防線
          if (
            !/credentials:\s*"omit"/.test(js) ||
            !/cache:\s*"no-store"/.test(js) ||
            !/referrerPolicy:\s*"no-referrer"/.test(js)
          ) {
            console.error('::error::app.js must enforce credentials: "omit", cache: "no-store", and referrerPolicy: "no-referrer"');
            process.exit(1);
          }

          console.log("Strict CSP, PWA manifest, zero-CDN, CSS hygiene & exact API allowlist checks passed.");
          EOF
